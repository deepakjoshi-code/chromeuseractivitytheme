name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Unit, integration and contract tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # No dependencies: core/ is pure and the suite runs on node:test alone.
      - run: npm test

  package:
    name: Build and verify the shipping artifact
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright + Chromium
        run: |
          npm install --no-save playwright@1
          npx playwright install --with-deps chromium
      - name: Build the extension package
        run: npm run build
      # Loads the built .zip in real Chrome: catches anything that exists in the
      # tree but never made it into the artifact.
      - name: Verify the package loads in Chrome
        run: node tools/verify-package.mjs
      - name: End-to-end suite against real Chrome
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        with:
          name: aura-extension
          path: dist/*.zip
          if-no-files-found: error
